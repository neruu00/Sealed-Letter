# Netlify detects Next.js from publish = ".next" and runs it through its
# Next.js runtime (server rendering for /l/[id]); any other publish dir
# deploys it as a static site and every route 404s.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly so the Next.js runtime runs even if Netlify's framework
# auto-detection is off for this site (otherwise .next is served as static files).
[[plugins]]
  package = "@netlify/plugin-nextjs"
